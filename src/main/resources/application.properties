spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# PostgreSQL datasource (used in dev/prod with Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/enterpriseday}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT signing secret. Optional: if APP_JWT_SECRET is not set, one is generated on first start and stored in
# the database (app_secrets table). If set, it must be at least 32 characters.
app.jwt.secret=${APP_JWT_SECRET:}

# First staff account, created only while no staff accounts exist (see .env.example).
app.staff.bootstrap-username=${APP_STAFF_BOOTSTRAP_USERNAME:}
app.staff.bootstrap-password=${APP_STAFF_BOOTSTRAP_PASSWORD:}

# Client IPs: trust X-Forwarded-For only from internal proxy addresses (our nginx/Caddy on the Docker network).
# Tomcat walks the header right-to-left past those proxies, so a header faked by a client is ignored.
server.forward-headers-strategy=native

# Cross-origin access is off by default (frontend and API share an origin). Comma-separated list if needed.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Where uploaded images are stored on disk. Override with APP_UPLOAD_DIR or -Dapp.upload-dir.
app.upload-dir=${APP_UPLOAD_DIR:./uploads}

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
app.upload-dir=./uploads
# This file replaces src/main/resources/application.properties in tests, so security-relevant settings
# from there are repeated here.
server.forward-headers-strategy=native
# Test-only signing secret. Never use this value for a real deployment.
app.jwt.secret=test-only-jwt-secret-not-for-any-real-deployment

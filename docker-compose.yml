services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Secrets come from an untracked .env file next to this one. Copy .env.example to .env and fill it in.
    environment:
      POSTGRES_DB: enterpriseday
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    # Only reachable from this machine (for debugging); other containers use the Docker network.
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    # 1. Provide the GitHub Image Name
    image: ghcr.io/seasoned-coder/news-backend:latest
    # 2. Keep the build instruction for your laptop
    restart: unless-stopped
    build: .
    # Only reachable from this machine; browsers go through the frontend's nginx (/api, /uploads).
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/enterpriseday
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env (see .env.example)}
      # Only used to create the first staff account; safe to remove from .env afterwards.
      APP_STAFF_BOOTSTRAP_USERNAME: ${APP_STAFF_BOOTSTRAP_USERNAME:-}
      APP_STAFF_BOOTSTRAP_PASSWORD: ${APP_STAFF_BOOTSTRAP_PASSWORD:-}
    depends_on:
      - db
    volumes:
      - uploads:/app/uploads

  frontend:
    # 1. Provide the GitHub Image Name
    image: ghcr.io/seasoned-coder/news-frontend:latest
    # 2. Keep the build instruction for your laptop
    restart: unless-stopped
    build:
      context: ./frontend
      target: production
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    # Set FRONTEND_PORT=80 in .env at the event so phones can use http://<server-ip>/ with no port.
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    # Uploads are deliberately NOT mounted here: nginx proxies /uploads to the backend, which decides
    # who may see each file.
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  uploads:
  caddy_data:
  caddy_config:

# Builds and publishes the Docker images to GitHub Container Registry (issue #46), so no laptop is involved.
#
# Publish: create a GitHub Release with a new tag like v2026.10.04 (or `git tag v2026.10.04 && git push origin
# v2026.10.04`). Tests must pass first. Images get two tags: `latest` and the release tag, which the app also
# shows as its version. Pushes to main never publish, so unfinished work can't become `latest`.
#
# Dry run: Actions -> Release images -> Run workflow builds everything without pushing.
name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the images? (unticked = dry run: test and build only)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# One release at a time; a second tag pushed quickly waits rather than racing for `latest`.
concurrency:
  group: release-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/seasoned-coder/news-backend
  FRONTEND_IMAGE: ghcr.io/seasoned-coder/news-frontend

jobs:
  test:
    name: Tests (backend and frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Backend tests and coverage check
        run: mvn -B verify

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

  images:
    name: Build and push images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dryrun-$(date -u +%Y.%m.%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "push=${{ inputs.push && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        if: steps.version.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.version.outputs.push == 'true' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: production
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          push: ${{ steps.version.outputs.push == 'true' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Summary
        shell: bash
        run: |
          if [[ "${{ steps.version.outputs.push }}" == "true" ]]; then
            {
              echo "### Published ${{ steps.version.outputs.version }}"
              echo "- \`${BACKEND_IMAGE}:latest\` and \`:${{ steps.version.outputs.version }}\`"
              echo "- \`${FRONTEND_IMAGE}:latest\` and \`:${{ steps.version.outputs.version }}\`"
              echo "On the event server: \`docker compose pull db backend frontend && docker compose up -d db backend frontend\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Dry run: tests passed and both images built; nothing was pushed" >> "$GITHUB_STEP_SUMMARY"
          fi

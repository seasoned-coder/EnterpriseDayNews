server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Work out the real client IP here, at the edge. A visitor's own X-Forwarded-For is only believed
    # when the request comes from a Docker network address (i.e. our Caddy proxy in the hosted setup).
    # At the event, phones connect straight to this nginx from the private Wi-Fi, so anything they put
    # in X-Forwarded-For is ignored. NOTE: if the event Wi-Fi itself uses 172.16.0.0/12 addresses,
    # change this range to just the Docker network's subnet.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        # Replace (don't append to) the client's header: the backend only ever sees the resolved IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

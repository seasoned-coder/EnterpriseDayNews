server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Work out the real client IP here, at the edge. A visitor's own X-Forwarded-For is only believed
    # when the request comes from a Docker network address (i.e. our Caddy proxy in the hosted setup).
    # At the event, phones connect straight to this nginx from the private Wi-Fi, so anything they put
    # in X-Forwarded-For is ignored. NOTE: if the event Wi-Fi itself uses 172.16.0.0/12 addresses,
    # change this range to just the Docker network's subnet.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # The backend is on the same machine, so connecting takes milliseconds. If it's down or restarting,
    # say so within a few seconds (502) instead of leaving phones and the projector waiting a minute (#39).
    proxy_connect_timeout 5s;

    # Live updates (issue #43): one long-lived Server-Sent Events stream per open page. Pass each event on
    # straight away (no buffering) and don't cut quiet streams off (the server pings every 25 s).
    location = /api/events {
        proxy_pass http://backend:8080/api/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        # Replace (don't append to) the client's header: the backend only ever sees the resolved IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
